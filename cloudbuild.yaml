# Cloud Build pipeline: build image -> push to Artifact Registry -> deploy to Cloud Run.
# Manual (tag defaults to "latest"):
#   gcloud builds submit --config cloudbuild.yaml
# Manual with git SHA:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_IMAGE_TAG=$(git rev-parse --short HEAD)
# Trigger builds should set _IMAGE_TAG=$SHORT_SHA (see docs/ci-cd.md).
substitutions:
  _REGION: us-central1
  _REPOSITORY: travel-platform
  _SERVICE: travel-ingestion-api
  _RUNTIME_SA_ID: travel-ingestion-sa
  _BQ_DATASET: travel_analytics
  _BQ_LOCATION: US
  _IMAGE_TAG: latest

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA_ID}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,BQ_DATASET=${_BQ_DATASET},BQ_LOCATION=${_BQ_LOCATION},LOG_LEVEL=INFO
      - --allow-unauthenticated
      - --timeout=300

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
